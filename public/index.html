<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProductManagementIQ – Lenny's Podcast Insights</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --surface2:#1c2128;
      --border:  rgba(255,255,255,0.08);
      --accent:  #f97316;
      --accent2: #8b5cf6;
      --text:    #e6edf3;
      --muted:   #7d8590;
      --green:   #3fb950;
      --blue:    #58a6ff;
    }

    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── HEADER ── */
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: rgba(13,17,23,0.9);
      backdrop-filter: blur(14px);
      z-index: 100;
    }
    .logo { font-size: 1.35rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .logo-badge { font-size: 0.72rem; background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.3); color: var(--accent); padding: 2px 10px; border-radius: 50px; font-weight: 600; margin-left: 6px; vertical-align: middle; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .status-pill { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); padding: 4px 12px; border-radius: 50px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; transition: background 0.4s, box-shadow 0.4s; }
    .dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.partial { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; }

    /* ── LAYOUT ── */
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 57px); }

    /* ── SIDEBAR ── */
    aside { border-right: 1px solid var(--border); padding: 20px 12px; overflow-y: auto; position: sticky; top: 57px; height: calc(100vh - 57px); }
    .aside-section { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; padding: 0 10px; margin: 16px 0 8px; }
    .aside-section:first-child { margin-top: 0; }
    .nav-btn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: none; border-radius: 8px; background: transparent; color: var(--muted); font-size: 0.875rem; cursor: pointer; text-align: left; transition: background 0.15s, color 0.15s; }
    .nav-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .nav-btn.active { background: rgba(249,115,22,0.12); color: var(--accent); font-weight: 600; }
    .nav-icon { width: 20px; text-align: center; font-size: 1rem; }
    hr.divider { border: none; border-top: 1px solid var(--border); margin: 12px 10px; }

    /* ── MAIN ── */
    main { padding: 28px 32px; overflow-y: auto; }

    /* search */
    .search-row { display: flex; gap: 10px; margin-bottom: 28px; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap input { width: 100%; padding: 12px 48px 12px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus { border-color: rgba(249,115,22,0.5); }
    .search-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: var(--accent); border: none; border-radius: 7px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
    .search-btn:hover { opacity: 0.85; }

    /* page heading */
    .page-heading { margin-bottom: 22px; }
    .page-heading h2 { font-size: 1.35rem; font-weight: 700; }
    .page-heading p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

    /* ── INSIGHT CARDS ── */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

    .ins-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .ins-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.2s; }
    .ins-card:hover { border-color: rgba(249,115,22,0.35); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .ins-card:hover::after { opacity: 1; }

    .card-byline { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); margin-bottom: 8px; }
    .card-quote {
      font-size: 0.9rem; line-height: 1.55; color: #c9d1d9;
      font-style: italic;
      padding-left: 12px;
      border-left: 2px solid rgba(249,115,22,0.4);
      margin-bottom: 10px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-insight { font-size: 0.83rem; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .card-ts { font-size: 0.72rem; color: var(--muted); }
    .card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag { font-size: 0.68rem; padding: 2px 8px; border-radius: 50px; background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.2); color: #a78bfa; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .tag[data-topic]:hover { background: rgba(139,92,246,0.28); color: #c4b5fd; }
    .tag.green { background: rgba(63,185,80,0.1); border-color: rgba(63,185,80,0.2); color: var(--green); }

    /* ── EPISODE LIST VIEW ── */
    .ep-list { display: flex; flex-direction: column; gap: 10px; }
    .ep-row {
      display: flex; align-items: flex-start; gap: 16px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px;
      cursor: pointer; transition: border-color 0.2s;
    }
    .ep-row:hover { border-color: rgba(249,115,22,0.35); }
    .ep-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
    .ep-info { flex: 1; min-width: 0; }
    .ep-name { font-weight: 700; font-size: 0.95rem; }
    .ep-title { font-size: 0.82rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ep-topics { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
    .ep-count { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; align-self: center; }

    /* ── EPISODE DETAIL (full page) ── */
    .ep-detail { display: none; }
    .ep-detail.visible { display: block; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 0.85rem; padding: 6px 14px; cursor: pointer; margin-bottom: 24px; transition: color 0.2s; }
    .back-btn:hover { color: var(--text); }

    .ep-header { margin-bottom: 28px; }
    .ep-header .guest { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
    .ep-header h1 { font-size: 1.6rem; font-weight: 800; line-height: 1.3; margin-bottom: 10px; }
    .ep-header .desc { color: var(--muted); font-size: 0.9rem; line-height: 1.65; }

    .section-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; margin: 28px 0 12px; }

    .themes-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .theme-row { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; display: flex; align-items: baseline; gap: 12px; }
    .theme-name { font-weight: 700; font-size: 0.9rem; flex: 1; }
    .theme-desc { color: var(--muted); font-size: 0.82rem; flex: 2; }
    .relevance { font-size: 0.72rem; color: var(--accent); font-weight: 700; flex-shrink: 0; }

    .insights-full { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .ins-full {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
    }
    .ins-full blockquote {
      font-style: italic; font-size: 0.92rem; color: #c9d1d9; line-height: 1.6;
      padding-left: 14px; border-left: 3px solid var(--accent);
      margin-bottom: 12px;
    }
    .ins-full .insight-text { font-size: 0.85rem; color: var(--text); line-height: 1.55; margin-bottom: 10px; }
    .ins-full .ins-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ins-full .ts { font-size: 0.72rem; color: var(--muted); }
    .actionable-badge { font-size: 0.68rem; padding: 2px 8px; border-radius: 50px; background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.25); color: var(--green); font-weight: 700; }

    .fw-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .fw-badge { background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.2); color: var(--blue); font-size: 0.78rem; padding: 4px 12px; border-radius: 8px; font-weight: 600; }

    /* ── SKELETON ── */
    .skel { background: linear-gradient(90deg, var(--surface) 25%, rgba(255,255,255,0.05) 50%, var(--surface) 75%); background-size: 400% 100%; animation: shimmer 1.4s infinite; border-radius: 12px; }
    .skel-card { height: 160px; }
    @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    /* ── EMPTY / ERROR ── */
    .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 12px; color: var(--muted); text-align: center; }
    .state-icon { font-size: 48px; }
    .state-title { font-size: 1.05rem; font-weight: 600; color: var(--text); }
    .state-sub { font-size: 0.85rem; max-width: 380px; line-height: 1.6; }

    /* ── RESPONSIVE ── */
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      aside { display: none; }
      main { padding: 20px 16px; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">ProductManagementIQ</span>
  <span class="logo-badge">Lenny's Podcast</span>
  <div class="header-right">
    <div class="status-pill">
      <div class="dot" id="statusDot"></div>
      <span id="statusLabel">Connecting…</span>
    </div>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="aside-section">Topics</div>
    <button class="nav-btn active" data-q="product strategy" data-label="Product Strategy"><span class="nav-icon">🧭</span>Product Strategy</button>
    <button class="nav-btn" data-q="user research discovery" data-label="User Research"><span class="nav-icon">🔍</span>User Research</button>
    <button class="nav-btn" data-q="prioritization roadmap" data-label="Prioritization"><span class="nav-icon">📋</span>Prioritization</button>
    <button class="nav-btn" data-q="metrics OKR growth" data-label="Metrics & OKRs"><span class="nav-icon">📊</span>Metrics & OKRs</button>
    <button class="nav-btn" data-q="go to market launch" data-label="Go-to-Market"><span class="nav-icon">🚀</span>Go-to-Market</button>
    <button class="nav-btn" data-q="leadership management team" data-label="Leadership"><span class="nav-icon">👥</span>Leadership</button>
    <button class="nav-btn" data-q="growth retention viral" data-label="Growth"><span class="nav-icon">📈</span>Growth</button>
    <button class="nav-btn" data-q="AI artificial intelligence" data-label="AI in Product"><span class="nav-icon">🤖</span>AI in Product</button>
    <button class="nav-btn" data-q="startup founder zero-to-one" data-label="Startups"><span class="nav-icon">💡</span>Startups</button>
    <button class="nav-btn" data-q="pricing monetization" data-label="Pricing"><span class="nav-icon">💰</span>Pricing</button>
    <button class="nav-btn" data-q="feedback culture communication" data-label="Feedback & Culture"><span class="nav-icon">💬</span>Feedback & Culture</button>
    <button class="nav-btn" data-q="career personal productivity" data-label="Career Growth"><span class="nav-icon">🌱</span>Career Growth</button>
    <hr class="divider" />
    <div class="aside-section">Browse</div>
    <button class="nav-btn" id="btnEpisodes"><span class="nav-icon">🎙️</span>All Episodes</button>
    <button class="nav-btn" id="btnFrameworks"><span class="nav-icon">🛠️</span>Frameworks</button>
  </aside>

  <main>
    <div class="search-row">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder='Search 280+ insights… e.g. "how to set OKRs" or "roadmap prioritization"' />
        <button class="search-btn" id="searchBtn">🔎</button>
      </div>
    </div>

    <div class="page-heading">
      <h2 id="pageTitle">Product Strategy</h2>
      <p id="pageMeta">Insights from Lenny's Podcast</p>
    </div>

    <div id="mainContent"></div>
    <div class="ep-detail" id="epDetail"></div>
  </main>
</div>

<script>
let allEpisodes = [];

// ── FETCH DATA ──
async function loadEpisodes() {
  const r = await fetch('/api/data/episodes');
  allEpisodes = await r.json();
}

async function searchEpisodes(q) {
  const r = await fetch(`/api/data/search?q=${encodeURIComponent(q)}`);
  return r.json();
}

// ── RENDER HELPERS ──
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function topicTag(t) { return `<span class="tag" data-topic="${esc(t)}">${esc(t.replace(/-/g,' '))}</span>`; }

function insightCard(insight, guestName) {
  const tags = insight.topics?.slice(0,3).map(topicTag).join('') || '';
  const actionable = insight.actionable ? '<span class="actionable-badge">Actionable</span>' : '';
  return `
    <div class="ins-card" onclick='showEpisodeByGuest(${JSON.stringify(guestName)})'>
      <div class="card-byline">🎙️ ${esc(guestName)}</div>
      <div class="card-quote">${esc(insight.quote)}</div>
      <div class="card-insight">${esc(insight.insight)}</div>
      <div class="card-footer">
        <span class="card-ts">${esc(insight.timestamp || '')}</span>
        <div class="card-tags">${tags}${actionable}</div>
      </div>
    </div>`;
}

// ── VIEWS ──

function showSkeletons() {
  setContent(`<div class="cards-grid">${Array.from({length:8},()=>'<div class="skel skel-card"></div>').join('')}</div>`);
}

function setContent(html) {
  document.getElementById('mainContent').innerHTML = html;
  document.getElementById('mainContent').style.display = '';
  const ep = document.getElementById('epDetail');
  ep.classList.remove('visible');
  ep.innerHTML = '';
}

function showTopicInsights(episodes, query, label) {
  if (!episodes.length) {
    setContent(`<div class="state-box"><div class="state-icon">🔭</div><div class="state-title">No results</div><div class="state-sub">Try a different topic or use the search bar.</div></div>`);
    setMeta(label, 'No results found');
    return;
  }

  const cards = [];
  for (const ep of episodes) {
    const insights = ep._matched_insights || ep.key_insights.slice(0,3);
    for (const ins of insights.slice(0,3)) {
      cards.push(insightCard(ins, ep.guest_name));
    }
  }

  setMeta(label, `${cards.length} insights across ${episodes.length} episodes`);
  setContent(`<div class="cards-grid">${cards.join('')}</div>`);
}

function renderTranscriptResults(results, query) {
  if (!results.length) {
    setContent(`<div class="state-box"><div class="state-icon">🔭</div><div class="state-title">No results</div><div class="state-sub">Try a different search term.</div></div>`);
    setMeta(`"${query}"`, 'No results');
    return;
  }
  setMeta(`"${query}"`, `${results.length} episodes matched across 303 transcripts`);
  const cards = results.map(r => `
    <div class="ins-card" style="cursor:default">
      <div class="card-byline">🎙️ ${esc(r.guest)}</div>
      <div class="card-quote">${esc(r.snippet)}</div>
      <div class="card-footer">
        <span class="card-ts">Transcript excerpt</span>
        <div class="card-tags"><span class="tag" style="background:rgba(88,166,255,0.1);border-color:rgba(88,166,255,0.2);color:var(--blue)">303 episodes</span></div>
      </div>
    </div>`).join('');
  setContent(`<div class="cards-grid">${cards}</div>`);
}

function showAllEpisodes() {
  setMeta('All Episodes', `${allEpisodes.length} episodes from Lenny's Podcast`);
  const rows = allEpisodes.map(ep => {
    const initials = ep.guest_name.split(' ').map(w => w[0]).slice(0,2).join('');
    const topics = (ep.topics || []).slice(0,4).map(topicTag).join('');
    return `
      <div class="ep-row" onclick='showEpisodeByGuest(${JSON.stringify(ep.guest_name)})'>
        <div class="ep-avatar">${esc(initials)}</div>
        <div class="ep-info">
          <div class="ep-name">${esc(ep.guest_name)}</div>
          <div class="ep-title">${esc(ep.title)}</div>
          <div class="ep-topics">${topics}</div>
        </div>
        <div class="ep-count">${ep.key_insights?.length || 0} insights</div>
      </div>`;
  }).join('');
  setContent(`<div class="ep-list">${rows}</div>`);
}

function showFrameworks() {
  setMeta('Frameworks', 'Product frameworks extracted from Lenny\'s Podcast');
  const all = [];
  for (const ep of allEpisodes) {
    const fws = ep.frameworks_mentioned || [];
    fws.forEach(fw => {
      const name = typeof fw === 'string' ? fw : fw.name;
      const desc = typeof fw === 'object' ? fw.description : '';
      if (name) all.push({ name, desc, guest: ep.guest_name });
    });
  }

  const cards = all.map(fw => `
    <div class="ins-card" onclick='showEpisodeByGuest(${JSON.stringify(fw.guest)})' style="cursor:pointer">
      <div class="card-byline">🛠️ ${esc(fw.guest)}</div>
      <div class="card-quote" style="font-style:normal;border-left-color:var(--accent2)">${esc(fw.name)}</div>
      ${fw.desc ? `<div class="card-insight">${esc(fw.desc)}</div>` : ''}
    </div>`).join('');

  setContent(`<div class="cards-grid">${cards}</div>`);
}

function showEpisodeByGuest(guestName) {
  const ep = allEpisodes.find(e => e.guest_name === guestName);
  if (!ep) return;

  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('pageTitle').textContent = ep.guest_name;
  document.getElementById('pageMeta').textContent = ep.title;

  const themes = (ep.key_themes || []).map(t => `
    <div class="theme-row">
      <div class="theme-name">${esc(t.theme)}</div>
      <div class="theme-desc">${esc(t.description)}</div>
      <div class="relevance">${Math.round((t.relevance_score||0)*100)}%</div>
    </div>`).join('');

  const insights = (ep.key_insights || []).map(i => `
    <div class="ins-full">
      <blockquote>${esc(i.quote)}</blockquote>
      <div class="insight-text">${esc(i.insight)}</div>
      <div class="ins-meta">
        <span class="ts">${esc(i.timestamp||'')}</span>
        ${i.actionable ? '<span class="actionable-badge">Actionable</span>' : ''}
        ${(i.topics||[]).slice(0,3).map(topicTag).join('')}
      </div>
    </div>`).join('');

  const fws = (ep.frameworks_mentioned || []).map(fw => {
    const name = typeof fw === 'string' ? fw : fw.name;
    return `<span class="fw-badge">${esc(name)}</span>`;
  }).join('');

  const detail = document.getElementById('epDetail');
  detail.innerHTML = `
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div class="ep-header">
      <div class="guest">🎙️ ${esc(ep.guest_name)}</div>
      <h1>${esc(ep.title)}</h1>
      <p class="desc">${esc(ep.description)}</p>
    </div>
    ${themes ? `<div class="section-label">Key Themes</div><div class="themes-list">${themes}</div>` : ''}
    <div class="section-label">${ep.key_insights?.length || 0} Insights</div>
    <div class="insights-full">${insights}</div>
    ${fws ? `<div class="section-label">Frameworks</div><div class="fw-list">${fws}</div>` : ''}
  `;
  detail.classList.add('visible');
  window.scrollTo(0, 0);
}

let _lastTopicQ = 'product strategy';
let _lastTopicLabel = 'Product Strategy';

function goBack() {
  document.getElementById('epDetail').classList.remove('visible');
  document.getElementById('mainContent').style.display = '';
  document.getElementById('pageTitle').textContent = _lastTopicLabel;
}

function setMeta(title, sub) {
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageMeta').textContent = sub;
}

// ── TAG CLICK (filter by topic) ──
async function filterByTopic(topic) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const q = topic.replace(/-/g,' ');
  const label = q.replace(/\b\w/g, c => c.toUpperCase());
  _lastTopicQ = q; _lastTopicLabel = label;
  setMeta(label, 'Loading…');
  showSkeletons();
  const results = await searchEpisodes(q);
  showTopicInsights(results, q, label);
}

document.addEventListener('click', e => {
  const tagEl = e.target.closest('.tag[data-topic]');
  if (!tagEl) return;
  e.stopPropagation();
  filterByTopic(tagEl.dataset.topic);
}, true);

// ── NAV ──
document.querySelectorAll('.nav-btn[data-q]').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const q = btn.dataset.q;
    const label = btn.dataset.label;
    _lastTopicQ = q; _lastTopicLabel = label;
    setMeta(label, 'Loading…');
    showSkeletons();
    const results = await searchEpisodes(q);
    showTopicInsights(results, q, label);
  });
});

document.getElementById('btnEpisodes').addEventListener('click', () => {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btnEpisodes').classList.add('active');
  _lastTopicLabel = 'All Episodes';
  showAllEpisodes();
});

document.getElementById('btnFrameworks').addEventListener('click', () => {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btnFrameworks').classList.add('active');
  _lastTopicLabel = 'Frameworks';
  showFrameworks();
});

// ── SEARCH ──
async function doSearch(q) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  _lastTopicLabel = `"${q}"`;
  showSkeletons();
  setMeta(`"${q}"`, 'Searching…');

  const json = await fetch(`/api/search?q=${encodeURIComponent(q)}`).then(r => r.json());

  if (json.source === 'transcripts') {
    renderTranscriptResults(json.results, q);
    return;
  }

  showTopicInsights(json.results || [], q, `"${q}"`);
}

document.getElementById('searchBtn').addEventListener('click', () => {
  const q = document.getElementById('searchInput').value.trim();
  if (q) doSearch(q);
});
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('searchBtn').click();
});

// ── STATUS CHECK ──
let liveSearchReady = false;

async function checkStatus() {
  try {
    const s = await fetch('/api/status').then(r => r.json());
    liveSearchReady = s.ready;
    const dot = document.getElementById('statusDot');
    const label = document.getElementById('statusLabel');
    dot.className = s.ready ? 'dot online' : 'dot partial';
    label.textContent = s.ready
      ? `${s.episodes} episodes indexed`
      : `${s.episodes} curated episodes · indexing…`;
    if (!s.ready) setTimeout(checkStatus, 5000);
  } catch {
    document.getElementById('statusLabel').textContent = 'Offline';
  }
}

// ── INIT ──
window.showEpisodeByGuest = showEpisodeByGuest;
window.goBack = goBack;

(async () => {
  showSkeletons();
  await Promise.all([loadEpisodes(), checkStatus()]);
  const results = await searchEpisodes('product strategy');
  showTopicInsights(results, 'product strategy', 'Product Strategy');
})();
</script>
</body>
</html>
